services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cad
      POSTGRES_USER: cad
      POSTGRES_PASSWORD: cad_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cad -d cad"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cad-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 2 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  osrm:
    image: osrm/osrm-backend
    container_name: cad-osrm
    restart: unless-stopped
    volumes:
      - ./infrastructure/osrm:/data
    command: >
      osrm-routed
      --algorithm mld
      /data/egypt-latest.osrm
    ports:
      - "5000:5000"

  backend:
    build: ./backend
    container_name: cad-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://cad:cad_password@postgres:5432/cad
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      OSRM_URL: http://osrm:5000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log: